<html>
    <head><title>Astrologer app</title>
    <link rel ="stylesheet" href ="./astrologer.css"></head>
    <body>
        <div class="container">
            <h1> Astrologer Website</h1>
            <form id ="astroform">
                <label for = "name">First Name</label>
                <input type ="text" id ="name" name ="name" required>

                <label for ="Surname">Surname</label>
                <input type = "text" id ="surname" name ="surname" required>

                <label for ="day">Date of Birth(day)</label>
                <input type ="number" id ="day" name ="day" min ="1" max ='31' required>

                <label for ="month">Month:</label>
                <input  type ="number" id ="month" name ="month" min ="1" max ="12" required>

                <label for ="year">year</label>
                <input type ="number" id ="year" name ="year" min="1990" max ="2025">

                <input type ="submit" value ="get Insights">

            </form>
            <div class="result" id="result"></div>
    </div>
        
        <script src ="./astrologer.js"></script>
    </body>
</html>
